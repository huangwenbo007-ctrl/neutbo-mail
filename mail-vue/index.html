<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#F1F1F1" id="theme-color-meta">
  <meta name="description" content="Cloud Mail 是一个 Serverless 响应式邮箱服务，支持邮件发送，可部署到 Cloudflare 平台，降低服务器成本。Cloud Mail is a serverless responsive email service that supports email sending and can be deployed on Cloudflare to reduce server costs.">
  <title>Cloud Mail</title>
  <link rel="icon" href="%BASE_URL%neutbo-favicon-v1.svg" type="image/svg+xml">
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    window.neutboLoadingStartedAt = performance.now();
    const uiStoreStr =  localStorage.getItem('ui')
    let isDark = false
    if (uiStoreStr) {
      const uiStore =  JSON.parse(uiStoreStr)
      isDark = uiStore.dark
      const root = document.documentElement
      root.setAttribute('class', isDark ? 'dark' : '');
    }
    const metaTag = document.getElementById('theme-color-meta');
    const isMobile =  !window.matchMedia("(pointer: fine) and (hover: hover)").matches;
    metaTag.setAttribute('content', isDark ? (isMobile ? '#141414' : '#000000') : (isMobile ? '#FFFFFF' : '#F1F1F1'));
  </script>
</head>
<style>
  html { background: #fff; }
  html.dark { background: #141414; }
  #loading-first {
    position: fixed; inset: 0; z-index: 500; display: flex; align-items: center;
    justify-content: center; background: #fff; color: #000; opacity: 1;
    transition: opacity 200ms ease;
  }
  html.dark #loading-first { background: #141414; color: #fff; }
  #loading-first.loading-hide { pointer-events: none; opacity: 0; }
  .loading-icon { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .loading-bird { width: 144px; height: 144px; overflow: visible; }
  .loading-bird path { fill: currentColor; stroke: currentColor; stroke-width: 6; stroke-linejoin: round; }
  .loading-wing, .loading-body { transform-box: fill-box; transform-origin: center; }
  .loading-wing { animation: wing-in 580ms cubic-bezier(.18,.72,.2,1) both; }
  .loading-body { animation: body-in 580ms cubic-bezier(.18,.72,.2,1) 70ms both; }
  .loading-label { margin: 8px 0 0; color: #637084; font: 14px/1.5 system-ui, sans-serif; }
  html.dark .loading-label { color: #b8c1cc; }
  .loading-dots span { animation: loading-dot 1.15s ease-in-out infinite; }
  .loading-dots span:nth-child(2) { animation-delay: .16s; }
  .loading-dots span:nth-child(3) { animation-delay: .32s; }
  @keyframes wing-in { from { opacity: 0; transform: translate(-26px, 12px) rotate(-8deg) scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes body-in { from { opacity: 0; transform: translate(24px, 11px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes loading-dot { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #loading-first { transition: none; }
    .loading-wing, .loading-body, .loading-dots span { animation: none; }
  }
</style>
