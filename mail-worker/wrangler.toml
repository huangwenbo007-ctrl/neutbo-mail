name = "neutbo-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[[d1_databases]]
binding = "db"
database_name = "neutbo-mail"
database_id = "d781c914-ad12-40c1-8827-00fa7aad90d6"

[[kv_namespaces]]
binding = "kv"
id = "7b6249407976443188547a3589a1de4f"

[observability]
enabled = true

#[[d1_databases]]
#binding = "db"			#d1数据库绑定名默认不可修改
#database_name = ""		#d1数据库名字
#database_id = ""		#d1数据库id

#[[kv_namespaces]]
#binding = "kv"			#kv绑定名默认不可修改
#id = ""					#kv数据库id

#[[r2_buckets]]
#binding = "r2"			#r2对象存储绑定名默认不可修改
#bucket_name = ""		#r2对象存储桶的名字

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
#domain = []				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
#admin = ""					#管理员的邮箱	示例: admin@example.com
#jwt_secret = ""			#jwt令牌的密钥,随便填一串字符串

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"

# Branch previews must never use production storage or email triggers.
[previews.vars]
domain = ["neutbo.com"]
admin = "test-admin@neutbo.com"
orm_log = false
analysis_cache = false
account_deletion_test_only = "enabled"
google_reauth_redirect_uri = "https://feature-account-deletion-grace-neutbo-mail.huangwenbo007.workers.dev/login"

[[previews.d1_databases]]
binding = "db"
database_name = "neutbo-mail-deletion-test"
database_id = "a34fb478-041b-4e97-9009-6806cf10adc9"

[[previews.kv_namespaces]]
binding = "kv"
id = "ff4ce2a4c9e54acaba715c2932060672"
